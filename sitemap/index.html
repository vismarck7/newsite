<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사이트맵 | 충동</title>
<meta name="description" content="충동의 전체 페이지 구조를 한눈에 확인할 수 있는 사이트맵입니다.">
<link rel="canonical" href="https://www.chungdong.kr/sitemap/">
<meta name="robots" content="index, follow">
<link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-nav="">
<a class="skip-link" href="#main">본문 바로가기</a>
<header id="site-header" class="site-header"></header>

<nav class="breadcrumb" aria-label="브레드크럼">
  <ol>
    <li><a href="../">홈</a></li>
    <li aria-current="page">사이트맵</li>
  </ol>
</nav>

<main id="main">
<div class="content-page" style="max-width:var(--max-width);">
  <h1>사이트맵</h1>
  <p class="content-page__lead">충동의 전체 페이지를 한눈에 확인하고 원하는 글로 바로 이동해보세요.</p>

  <div class="sitemap-grid">
    <div>
      <h2>주요 페이지</h2>
      <ul>
        <li><a href="../">홈</a></li>
        <li><a href="../about/">사이트 소개</a></li>
        <li><a href="../author/">운영자 소개</a></li>
        <li><a href="../columns/">칼럼</a></li>
        <li><a href="../categories/">카테고리 전체</a></li>
        <li><a href="../contact/">문의하기</a></li>
      </ul>

      <h2>신뢰 정보</h2>
      <ul>
        <li><a href="../privacy/">개인정보처리방침</a></li>
        <li><a href="../terms/">이용약관</a></li>
        <li><a href="../disclaimer/">면책고지</a></li>
        <li><a href="../sitemap/">사이트맵</a></li>
      </ul>

      <h2>칼럼</h2>
      <ul id="sitemap-columns"></ul>
    </div>
    <div id="sitemap-categories"></div>
  </div>
</div>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="../data/site.config.js"></script>
<script src="../data/categories.js"></script>
<script src="../data/posts.js"></script>
<script src="../data/columns.js"></script>
<script>window.SITE_BASE = "../";</script>
<script src="../assets/js/common.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var catsMount = document.getElementById("sitemap-categories");
    catsMount.innerHTML = window.CATEGORIES.map(function (cat) {
      var posts = window.POSTS.filter(function (p) { return p.category === cat.slug; });
      var items = posts.map(function (p) {
        return '<li><a href="' + window.Chungdong.url("posts/" + p.slug + "/") + '">' + p.title + '</a></li>';
      }).join("");
      return (
        '<h2><a href="' + window.Chungdong.url("categories/" + cat.slug + "/") + '">' + cat.name + '</a></h2>' +
        '<ul>' + items + '</ul>'
      );
    }).join("");

    document.getElementById("sitemap-columns").innerHTML = window.COLUMNS.map(function (c) {
      return '<li><a href="' + window.Chungdong.url("columns/" + c.slug + "/") + '">' + c.title + '</a></li>';
    }).join("");
  });
</script>
</body>
</html>
